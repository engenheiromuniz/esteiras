name: Pipeline CI/CD Java com Docker

on:
  push:
    branches: [ "main" ]

# Permissões necessárias para que a esteira consiga publicar a imagem no seu perfil do GitHub
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do repositório
    - name: Copiar codigo do repositorio
      uses: actions/checkout@v4

    # 2. Instala o Java 17
    - name: Instalar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Compila a aplicação e gera o arquivo .jar (Fase de CI)
    - name: Compilar e Testar com Maven
      run: mvn clean package

    # 4. Faz login automático no registro de containers do GitHub usando o token da própria esteira
    - name: Fazer login no GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 5. Lê o seu Dockerfile, constrói a imagem e envia (push) para o seu perfil (Fase de CD!)
    - name: Construir e Publicar imagem Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}/api-java:latest
